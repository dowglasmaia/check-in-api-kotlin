# Full stack: docker compose up --build  ->  http://localhost:4200
services:
  api:
    build: ./api-check-in-api-kotlin
    image: check-in-api:local
    restart: unless-stopped
    # Not published to the host: the app container reaches it through the internal network (same origin, no CORS).
    expose:
      - "8080"

  app:
    build: ./app-check-in-api-angular
    image: check-in-app:local
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "${APP_PORT:-4200}:8080"
    depends_on:
      api:
        condition: service_healthy

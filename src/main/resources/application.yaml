server:
  port: 8080
  # Virtual Threads (Project Loom) — Spring Boot 4 + Java 21+
  # Decision: Virtual threads allow each HTTP request to be handled by a lightweight
  # virtual thread instead of a platform thread. Under blocking I/O (DB, HTTP),
  # virtual threads park without consuming OS threads, enabling high throughput
  # without reactive programming complexity (no WebFlux required).
  tomcat:
    threads:
      virtual:
        enabled: true

spring:
  application:
    name: check-in-api
  # Structured logging — Spring Boot 4 ships Logback with native JSON support.
  # Outputting JSON makes logs machine-readable by Splunk, Loki, CloudWatch etc.
  logging:
    structured:
      format:
        console: ecs   # Elastic Common Schema: timestamp, log.level, message, service.name
    level:
      root: INFO
      com.dowglasmaia.checkinapi: DEBUG   # Full debug visibility on domain logic in dev

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers, env, mappings
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true
  # Prometheus-compatible metrics exposition (scrape at /actuator/prometheus if micrometer-registry-prometheus is added)
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: MaiaFlight Check-in API
    description: Digital check-in service for MaiaFlight passengers
    version: 0.0.1-SNAPSHOT

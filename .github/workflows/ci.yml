name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api-check-in-api-kotlin/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            app:
              - 'app-check-in-api-angular/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-check-in-api-kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: api-check-in-api-kotlin/target/surefire-reports

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-check-in-api-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app-check-in-api-angular/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: No inline event handlers (blocked by the nginx CSP)
        run: "! grep -q 'onload=' dist/app-check-in-api-angular/browser/index.html"
      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  docker:
    needs: [api, app]
    # roda quando nenhum job anterior falhou (um deles pode ter sido ignorado pelo filtro de paths)
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: api-check-in-api-kotlin
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build app image (no push)
        uses: docker/build-push-action@v6
        with:
          context: app-check-in-api-angular
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

version: 2
updates:
  - package-ecosystem: maven
    directory: /api-check-in-api-kotlin
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /app-check-in-api-angular
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*']
  - package-ecosystem: docker
    directory: /api-check-in-api-kotlin
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /app-check-in-api-angular
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
